[pytest]
testpaths = tests
# The test names are sentences, so a failure reads as "this is what should have happened".
python_functions = test_*
addopts = -q --tb=short

filterwarnings =
    error
    # Starlette's own TestClient uses an anyio alias that anyio deprecated. Nothing here
    # can fix it, so it is silenced by name - never with a blanket "ignore", which would
    # also hide a warning coming from our own code.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # Raised while SQLAlchemy reflects a CHECK constraint during the drift check in
    # test_migrations.py. It comes from inside SQLAlchemy reading what PostgreSQL reports
    # about the constraint, not from anything here, and with `error` above it would turn a
    # passing check into a failure that looks like the whole schema is missing.
    ignore:Can't validate argument 'dialect_options':sqlalchemy.exc.SAWarning
