# La tienda. Cuatro servicios, y ninguno de ellos es Elasticsearch.
#
#   db         la base de datos
#   backend    la API. En un contenedor porque un colector lee el stdout de un CONTENEDOR
#   frontend   la web, con el servidor de desarrollo de Vite, en http://localhost:5173
#   filebeat   recoge ese stdout y lo manda a un Elasticsearch QUE NO ES NUESTRO
#
# ELASTICSEARCH Y KIBANA VIVEN APARTE, en el conjunto `elastic-real` de la sesión 24. Eso
# no es una comodidad, es el modelo correcto y merece decirse en clase: el sitio donde se
# guardan los logs es infraestructura compartida, con su propio ciclo de vida, su propia
# gente y su propia factura. No se levanta y se tira con cada aplicación que quiera
# escribir en él, igual que nadie levanta su propio Postgres dentro del contenedor de su
# API.
#
# Lo que queda aquí es lo único que es de la tienda: quién recoge SUS logs y a dónde los
# manda. Y ni siquiera eso lo sabe la tienda — lo sabe Filebeat.
#
#   cd ../python-demo/sesion-24/elastic-real && docker compose up -d   # primero, el destino
#   docker compose up -d --build                                       # luego, la tienda

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      # 127.0.0.1 y no solo "5432:5432". Sin la dirección, un puerto publicado escucha en
      # TODAS las interfaces, incluida la wifi en la que estés. Con ella, solo esta máquina.
      - "127.0.0.1:5432:5432"

  backend:
    # The context is the repository root and not ./backend, because the image has to be
    # able to copy data/images into itself. See the note at the top of backend/Dockerfile.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://shop:${POSTGRES_PASSWORD}@db:5432/shop
      # Qué dicen los logs sobre de dónde vienen. La tienda lo estampa en cada línea, así
      # que un mismo Elasticsearch puede tener desarrollo y producción sin mezclarlos.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Qué páginas pueden llamar a la API. Sale de .env (o del terminal); si no está, el
      # servidor de Vite de este mismo compose.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      IMAGES_DIR: /app/images # where the volume below is mounted; the API serves it at /images
      # The Stripe key, passed THROUGH from .env and never written here: this file is in
      # Git and that one is not. The `:?` makes compose refuse to start with a readable
      # message instead of handing the container an empty key and letting it discover the
      # problem at the first payment.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY missing in .env}
    depends_on:
      db:
        condition: service_healthy # do not start (and migrate) until PostgreSQL accepts connections
    # MEASURED, after the shop looked busy while doing nothing. The old version of this
    # block ran `python -c "import urllib.request; ..."` every 5 seconds, and inside this
    # image that costs 178 ms - against 11 ms to start the interpreter alone. Almost all
    # of it is importing urllib. 178 ms every 5 s is 3.6% of a core burned forever by the
    # one thing in the container that produces nothing.
    #
    # It also hides well: py-spy finds no busy thread, because the work is not in uvicorn
    # at all - it is a brand new process, every five seconds. `docker compose stats` is
    # what shows it, as a spike to ~20% between long stretches of 0.15%.
    #
    # Two changes, and the second is the one that matters:
    #   · http.client instead of urllib.request - same check, 138 ms instead of 178 ms.
    #     Worth taking, but it is only 22%: the interpreter is the expensive part, not the
    #     library.
    #   · interval 5s -> 30s, with start_interval keeping the checks fast only while the
    #     container is still starting. That is what `docker compose up --wait` needs to
    #     return quickly, and it is exactly what start_interval exists for.
    # Together: from ~3.6% of a core to ~0.5%, with the same check.
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h; c=h.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/health'); exit(0 if c.getresponse().status==200 else 1)"]
      interval: 30s
      start_interval: 2s # while still starting: quick, so `up --wait` is not slow
      timeout: 3s
      retries: 10
      start_period: 15s # la migración corre antes de que arranque el servidor
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/images:/app/images:ro

  # A toolbox for looking INSIDE the backend while it runs. It is not part of the shop and
  # it does not start with it:
  #
  #     docker compose --profile debug up -d debug
  #     docker compose exec debug htop            # processes and threads, live
  #     docker compose exec debug py-spy top --pid 1   # the same, but per PYTHON function
  #     docker compose --profile debug down       # and gone
  #
  # Why a container of its own instead of installing htop in the backend image: because the
  # backend image is the one that gets deployed, and every tool added to it is weight and
  # surface area that travels to production forever to be used twice. This one exists only
  # while it is asked for.
  #
  # The trick that makes it work is `pid: service:backend`: the two containers SHARE A
  # PROCESS NAMESPACE, so htop in here lists uvicorn out there and can measure it. Without
  # that line this container would only ever see itself.
  #
  # py-spy is the one that actually answers "which thread is burning CPU" for a Python
  # process: htop says "uvicorn, 100%", py-spy says which function. It needs SYS_PTRACE to
  # read another process's memory, which is exactly the permission a debugger needs and
  # exactly why it is not granted by default.
  debug:
    profiles: [debug]
    image: python:3.12-slim
    pid: "service:backend"
    cap_add: [SYS_PTRACE]
    # All the lines below are indented THE SAME. A YAML folded block (>) only joins lines
    # with a space while they share an indentation; indent one further and YAML keeps the
    # newline, sh sees a line starting with `&&`, and it dies with "Syntax error: &&
    # unexpected" after having installed everything. Cost: one confused minute.
    command: >
      sh -c "apt-get update -qq
      && apt-get install -y -qq --no-install-recommends htop procps
      && pip install --no-cache-dir -q py-spy
      && echo 'READY - try: docker compose exec debug htop'
      && sleep infinity"
    depends_on: [backend]

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      # La API solo admite este origen (CORS_ORIGINS). Si cambias el puerto, cambia también
      # esa variable, o el navegador bloqueará todas las llamadas.
      - "127.0.0.1:5173:5173"

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.3
    # Corre como root porque lee los ficheros de log de otros contenedores, que son de
    # root, y habla con el socket de Docker para saber de qué contenedor viene cada línea.
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      # La credencial, desde el entorno y NUNCA dentro de filebeat.yml, que sí está en Git.
      # Se saca de elastic-real/secretos/clave-python — mira .env.example.
      ELASTIC_API_KEY: ${ELASTIC_API_KEY:?ELASTIC_API_KEY missing in .env - see .env.example}
      ELASTIC_HOST: ${ELASTIC_HOST:?ELASTIC_HOST missing in .env}
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Donde Docker guarda el stdout de cada contenedor, como ficheros JSON. Solo lectura:
      # un colector no tiene nada que escribir aquí.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # El socket, para preguntarle a Docker el NOMBRE del contenedor detrás de cada
      # fichero. Sin él cada línea llegaría etiquetada con un id de 64 caracteres y poco más.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # El marcador de por dónde va leyendo. Sin este volumen, un reinicio reenvía todo
      # desde el principio y los logs salen duplicados.
      - shop_filebeatdata:/usr/share/filebeat/data
    networks:
      # Las dos, y esta es la parte que hay que entender. Un proyecto de compose crea su
      # propia red y no ve las de los demás: desde `tienda_default` el nombre
      # `elasticsearch` no existe, porque vive en otro proyecto.
      #
      # Tampoco sirve salir por el host: elastic-real publica el 9200 en 127.0.0.1, y el
      # localhost de un contenedor es el suyo, no el tuyo.
      #
      # Así que Filebeat se conecta a LAS DOS redes. Es el único servicio que lo necesita,
      # y es exactamente lo que es: la pieza que une dos sistemas que por lo demás no se
      # conocen.
      - default
      - elastic-real

networks:
  # `external: true` significa: esta red ya existe, no la crees y no la borres. La crea
  # `docker compose up` en ../python-demo/sesion-24/elastic-real, y si ese conjunto no está
  # levantado, la tienda se niega a arrancar con un error que lo dice.
  elastic-real:
    external: true
    name: elastic-real_default

volumes:
  shop_pgdata:
  shop_filebeatdata:
